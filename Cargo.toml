[package]
name = "rhnsw"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "rhnsw"
crate-type = ["cdylib", "rlib"]

[dependencies]
fearless_simd = "1.2"
pyo3 = "0.30"
numpy = "0.30"
rand = "0.10"
rayon = "1.12"

[features]
# Count distance computations and node expansions in queries (profiling only).
counters = []

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"

[[bench]]
name = "simd"
harness = false

# Graph tests build 10k-node indexes; unoptimized they take minutes.
[profile.test]
opt-level = 3

[profile.bench]
debug = true
