[package]
name = "nmslib-rs"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "HNSW approximate nearest neighbor search with Python bindings"
repository = "https://github.com/undo-git-pull/nmslib-rs"
readme = "README.md"

[lib]
name = "nmslib_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
fearless_simd = "1.2"
pyo3 = "0.30"
numpy = "0.30"
rand = "0.10"
rayon = "1.12"
memmap2 = "0.9"
bytemuck = "1.25"

[features]
# Count distance computations and node expansions in queries (profiling only).
counters = []

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"

[[bench]]
name = "simd"
harness = false

# Graph tests build 10k-node indexes; unoptimized they take minutes.
[profile.test]
opt-level = 3

[profile.bench]
debug = true
