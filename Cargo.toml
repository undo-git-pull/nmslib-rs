[package]
name = "rhnsw"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "rhnsw"
crate-type = ["cdylib", "rlib"]

[dependencies]
fearless_simd = "1.2"
pyo3 = "0.30"

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"
rand = "0.10"

[[bench]]
name = "simd"
harness = false

[profile.bench]
debug = true
