[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "nmslib-rs"
dynamic = ["version"]
description = "HNSW approximate nearest neighbor search in Rust"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
# Tests and benchmarks: pip install -e .[dev]  (or uv pip install ...)
dev = ["maturin>=1.16,<2.0", "pytest", "h5py", "nmslib==2.1.2"]

[project.urls]
Repository = "https://github.com/undo-git-pull/nmslib-rs"
